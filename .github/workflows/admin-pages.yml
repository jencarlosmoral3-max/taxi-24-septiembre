name: Admin Pages

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/admin-pages.yml
  pull_request:
    paths:
      - apps/admin/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/admin-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taxi24/admin build
        env:
          NEXT_PUBLIC_BASE_PATH: /taxi-24-septiembre
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
